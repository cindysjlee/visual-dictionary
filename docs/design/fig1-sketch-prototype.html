async function playFrom(k){RUN++;const id=RUN;paused=false;running=true;syncBtns();

async function goStep(i){

const KEEP=new Set(['viewBox','preserveAspectRatio','gradientTransform','gradientUnits','patternUnits','stdDeviation','clipPathUnits']);
function attrName(k){if(k==='className')return 'class';if(k==='xlinkHref')return 'href';if(KEEP.has(k))return k;return k.replace(/[A-Z]/g,m=>'-'+m.toLowerCase());}
function toDom(node,parent,depth=0){if(node==null||node===false||node===true||depth>60)return;
  if(Array.isArray(node)){node.forEach(n=>toDom(n,parent,depth+1));return;}
  if(typeof node==='string'||typeof node==='number'){parent.appendChild(document.createTextNode(String(node)));return;}
  const type=node.type,props=node.props||{};
  if(typeof type==='function'){toDom(type.prototype&&type.prototype.render?new type(props).render():type(props),parent,depth+1);return;}
  if(type&&typeof type==='object'){if(type.render){toDom(type.render(props,null),parent,depth+1);return;}if(type.type){toDom({type:type.type,props},parent,depth+1);return;}}
  if(typeof type!=='string'){toDom(props.children,parent,depth+1);return;}
  const svgNs=type==='svg'||parent.namespaceURI===NS;const e=svgNs?document.createElementNS(NS,type):document.createElement(type);
  for(const k in props){const v=props[k];if(k==='children'||v==null||typeof v==='function'||k==='key'||k==='ref')continue;
    if(k==='style'&&typeof v==='object'){for(const sk in v){try{e.style[sk]=typeof v[sk]==='number'&&!/opacity|zIndex/.test(sk)?v[sk]+'px':v[sk];}catch(_){}}continue;}
    e.setAttribute(svgNs?attrName(k):(k==='className'?'class':k),v);}
  parent.appendChild(e);toDom(props.children,e,depth+1);}
async function loadPeeps(){
  try{const m=await import('https://cdn.jsdelivr.net/npm/react-peeps@0.1.10/+esm');const Peep=m.default||m.Peep||m;
    const make=(props,w,h,x,y,flip)=>{const box=document.createElement('div');toDom({type:Peep,props},box);const s=box.querySelector('svg');if(!s||s.querySelectorAll('path').length<3)throw new Error('peep empty');
      s.removeAttribute('style');s.setAttribute('width',w);s.setAttribute('height',h);s.setAttribute('x',x);s.setAttribute('y',y);
      const g=document.createElementNS(NS,'g');if(flip)g.setAttribute('transform','scale(-1 1)');g.appendChild(s);return g;};
    peepsSVG={user:make({body:'Shirt',face:'Cute',hair:'ShortVolumed',strokeColor:'#34323C',backgroundColor:'#CFE3F7'},104,118,-52,-58,false),
      attacker:make({body:'Shirt',face:'Cute',hair:'ShortVolumed',facialHair:'Dali',accessory:'GlassRoundThick',strokeColor:'#34323C',backgroundColor:'#FFDCC8'},104,118,-52,-58,true)};
    if(V&&V.peeps){renderActor('user');renderActor('attacker');}
  }catch(e){console.warn('Open Peeps를 불러오지 못해 대체 그림을 씁니다.',e);peepsSVG=null;}}
