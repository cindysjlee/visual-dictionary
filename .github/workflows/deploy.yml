# 자동 배포(FR-DEP-05, docs/03 2.6). AWS 키는 저장하지 않고 OIDC로 역할을 맡는다(신뢰: 이 저장소 main 브랜치만).
# job 두 개(DF-49): verify(검증·E2E, OIDC 토큰 권한 없음) → deploy(id-token: write는 여기만, 설치 스크립트 없이 설치)
#   deploy: 보안 관문(권한 확장이면 멈춤) → 변경 관문(삭제·교체면 멈춤) → 같은 변경 세트 실행 → smoke:prod → check:aws
# 의존성 코드가 실행되는 단계(npm ci 설치 스크립트, 빌드·E2E)는 OIDC 토큰을 받을 수 없다. 공개 저장소라 pull_request_target은 쓰지 않는다. 외부 액션은 커밋 해시로 고정한다
name: deploy

on:
  workflow_dispatch:
  # 첫 수동 실행 성공 뒤 사용자 확인으로 켬(7단계)
  push:
    branches: [main]

# 기본은 읽기만. OIDC 토큰(id-token: write)은 deploy job에서만 준다
permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: 설치
        run: npm ci

      - name: verify(콘텐츠 검증·단위 테스트·빌드·묶음 검사)
        run: npm run verify

      - name: Chrome 설치(E2E는 설치된 Chrome 채널을 쓴다)
        run: npx playwright install --with-deps chrome

      # 실제 속도 테스트(realtime 프로젝트 2개)는 뺀다: GPU 없는 러너는 WebGL을 CPU로 그려 10fps가 안 되고, 장면 시간이 프레임당 0.1초로 묶여 실제 시간보다 느리다.
      # 그 2개는 로컬의 배포 전 전체 E2E에서 돌린다(CLAUDE.md)
      - name: E2E(workers 2, 실제 속도 테스트 제외)
        run: npm run test:e2e -- --project=main
        env:
          E2E_WORKERS: "2"

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # 설치 스크립트를 돌리지 않는다: 설치 스크립트가 있는 패키지는 esbuild(바이너리 확인용, 플랫폼 바이너리는 선택 패키지로 따로 설치)와 fsevents(macOS 전용)뿐이고,
      # 이 상태로 빌드·cdk synth(Lambda 묶기 포함)가 되는 것을 확인했다(DF-49)
      - name: 설치(설치 스크립트 없이)
        run: npm ci --ignore-scripts

      # 웹 스택은 apps/web/dist를 배포하므로 같은 커밋으로 다시 빌드한다(타입 검사 포함, 테스트는 verify job에서 끝남)
      - name: 빌드
        run: npm run build

      - name: AWS 역할 맡기(OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: visual-dictionary-deploy

      - name: 보안 관문(권한·보안 그룹을 넓히는 변경이 있으면 멈춤)
        run: node scripts/ci-gate.ts security

      - name: 변경 관문(리소스 삭제·교체가 있으면 멈춤)
        id: gate
        run: node scripts/ci-gate.ts changes

      - name: 배포(관문에서 검사한 같은 변경 세트 실행)
        if: steps.gate.outputs.stacks != ''
        working-directory: infra
        env:
          STACKS: ${{ steps.gate.outputs.stacks }}
        # execute-change-set는 스택을 하나만 받는다(DF-51). STACKS는 cdk list 순서(의존 순서)
        run: |
          for stack in $STACKS; do
            npx cdk deploy "$stack" --exclusively --method=execute-change-set --change-set-name ci-gate
          done

      - name: smoke:prod
        run: npm run smoke:prod

      - name: check:aws(배포된 리소스 설정, 읽기 전용)
        run: npm run check:aws
